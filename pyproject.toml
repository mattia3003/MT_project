[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memtk"
version = "0.1.0"
description = "Memorization toolkit: auditing a mask->MRI diffusion cascade for copied training masks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "nibabel",
    "monai",
    "torch",
    "pandas",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# anyio's pytest plugin (installed for other tools in the venv) emits a deprecation warning
addopts = ["-p", "no:anyio"]

[tool.pyright]
# Type checking for Pylance/pyright, shared by everyone working on the repo. False alarms from
# library type stubs get a one-line ignore with a reason (see CLAUDE.md), not a code rewrite.
typeCheckingMode = "standard"
