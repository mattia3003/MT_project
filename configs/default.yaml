# Default project config. Relative paths are resolved from the repository root.
# To run on new data, add an entry under real_datasets / synthetic_pools (or copy this file)
# and pass --dataset / --pool / --config to the scripts.

seed: 2026                          # single global seed for every random step

output_root: processed_data/model_space   # processed data, one subfolder per dataset/pool
results_root: results                     # experiment outputs (tables, figures)
splits_dir: splits                        # patient splits (version-controlled)
frozen_dir: configs/frozen                # frozen E3 thresholds, read by E4 and E5 (version-controlled)

default_real_dataset: stanford_brainmets
default_synthetic_pool: amibekk_v1

# Conversion of real data to the 128x128 "model space", identical to the original training
# transform: LoadImage -> EnsureChannelFirst -> ToTensor -> ScaleIntensity(0, 1) (per volume)
# -> Resize((128, 128, -1)) -> mask > threshold.
preprocessing:
  spatial_size: [128, 128]   # in-plane size; depth is kept (-1 in MONAI Resize)
  interpolation: area        # MONAI Resize default
  mask_threshold: 0.01       # strict '>', as make_binary in the original repo
  slice_axis: 2              # axial

# --- E0b decisions -------------------------------------------------------------------------
# Values marked null are decided by viewing the evidence of a review stage; set them by hand with
# a dated comment. A production stage refuses to run while a value it needs is null.

brain:
  # Decision A (evidence: `e0b_audit.py brain-review`)
  # brain tissue = pixels above this (low_threshold methods and tissue_px); depends on the data,
  # so re-check it with brain-review (threshold sensitivity table) whenever new data is used
  low_threshold: 0.02         # set 2026-11-02: on stanford_brainmets + amibekk_v1 it sits in the gap
                              # between background (99.9th pct <= ~0.01) and dim tissue (~0.03-0.09)
  # options: otsu | otsu_dilate1 | otsu_dilate2 | otsu_all | low_threshold | low_threshold_all
  method: low_threshold_all   # decided 2026-11-01: 1/6101 T lesions >50% outside the brain
                              # (Otsu: 74), 1.5% partly outside; keeps separate pieces in low slices
  # a synthetic MRI with less brain tissue than this counts as failed (near-blank);
  # tissue = pixels above 0.02 in regions >= 30 px (memtk.lesions.tissue_px)
  min_tissue_px: 20           # decided 2026-11-01: below 20 px all viewed synthetic MRIs have no
                              # brain (152 samples); the smallest real T lesion slice has 31 px

lesions:
  connectivity: 8
  # Decisions B and C (evidence: `e0b_audit.py lesions-review`)
  # px; smaller components are specks
  min_lesion_area: 4      # decided 2026-11-02: largest m with <= 1% of T components smaller (0.99%);
                          # clear size break in T and S (62% of synthetic components are 1 px)
  # max background px between a speck and a lesion for the speck to be attached (0 = drop-only)
  attach_gap: 2           # decided 2026-11-02: synthetic specks at gap 1-2 far above the ~1,150 per
                          # gap noise floor seen at gaps 4-10; gap 3 near it

qc:
  # Decision D (evidence: `e0b_audit.py qc-review`)
  # minor if 1..N isolated specks (kept), noisy if more (left out of the main audit)
  max_isolated_specks: 9      # decided 2026-11-02: masks per speck count fall steadily up to ~9, then a
                              # flat tail (~25-30 per count) of noise fields; old QC list excluded all >= 10
  edge_outside_frac: 0.5      # flag a real-sized lesion if more than this fraction lies outside the brain
  small_lesion_px: 40         # the sampling filter's "at least one lesion under 40 px"

filters:
  # the sampling script kept a mask only if its pixel sum was below this (repo: Sampling_mask_bravo.py);
  # its other filters are a lesion under qc.small_lesion_px and every lesion pixel inside the brain
  max_mask_px: 2000
  # Decision E (evidence: `e0b_audit.py filters-review`): which of max_mask_px, small_lesion,
  # inside_brain to apply to H-cal and H-eval (never to T); a list, [] for none
  real_sets: [max_mask_px]   # decided 2026-11-03: only this filter holds in the pool (100%; removes no real
                             # slice); small_lesion fails for 10.7% of the masks as saved, inside_brain is not
                             # shown with a meaningful brain definition

# --- E1-E3: detectors and calibration (docs/e1-e3-plan.md) ------------------------------------
# Fixed values come from the experiment plan; decisions are null until set after their review
# stage (`e3_calibrate.py`). E4 and E5 read the frozen copy written by `e3_calibrate.py freeze`.

detectors:
  whole_mask:                 # E1
    top_k_dice: 20            # candidates per query: the best by plain Dice ...
    top_k_centroid: 20        # ... plus the nearest by the centroid of the largest lesion
    max_shift_px: 3           # shift search of +-3 px in rows and columns (49 positions)
  lesion:                     # E2
    # Decision F (evidence: e0b_audit.py stats, centroid density)
    position_frame: pixel     # decided 2026-11-03: pixel coordinates; stage 1 copies keep the training
                              # mask's pixel positions, synthetic brains are smaller (median 3,009 vs 7,765 px)
    sigma: 0.05               # position factor exp(-d^2 / 2 sigma^2); fraction of the 128-px field = 6.4 px
    prefilter: 0.2            # lesion pairs farther apart are skipped: 25.6 px, position factor exp(-8)
    candidate_min_s: 0.1      # C is computed only for training slices sharing a lesion pair with s >= this

calibration:                  # E3
  # Thresholds at the percentile below of H-cal: tau_D (E1 score), tau_L (strongest lesion pair),
  # tau_C (configuration score C of the nearest neighbour). Decided 2026-11-03: C counts every
  # Hungarian-paired lesion with s >= detectors.lesion.candidate_min_s (first planned with only the
  # pairs reaching tau_L, which made C 0 for ~95% of H-cal slices and tau_C about 0); classes: full
  # copy = C(q, NN) >= tau_C, partial = not full but a lesion pair >= tau_L (the plan's rule)
  percentile: 95              # thresholds at this percentile of H-cal
  bootstrap_draws: 2000       # bootstrap by patient for the interval of every threshold
  # Decision G (evidence: `e3_calibrate.py bound-review`)
  provisional_tau_L: 0.77     # decided 2026-11-03: 95th percentile of the best scores of H-cal lesions >= 10 px
  chance_rate_max: 0.10       # decided 2026-11-03: the 5% cut falls within noise (15-24 px bins at 5.1-5.8%)
                              # and would remove 59% of S main from the lesion-level analysis
  informative_bound_px: 12    # decided 2026-11-03: from 12 px every bin stays below 10% (8.4% at 12-14 px);
                              # S main keeps 72% of slices; 25 px (5% cut) is run as a sensitivity in calibrate
  # Decision H (evidence: `e3_calibrate.py calibrate`): per detector, "stratified" (separate
  # thresholds for single- and multi-lesion slices) or "pooled"
  strata:
    whole_mask: stratified    # decided 2026-11-03: chance best Dice 0.905 single vs 0.729 multi; a pooled 0.898
                              # would flag 7.3% of single- and 0% of multi-lesion H-cal slices
    lesion: stratified        # decided 2026-11-03 (tau_L and tau_C): tau_L 0.739 single vs 0.816 multi (a pooled
                              # 0.771 flags 2.1% / 12.6%); tau_C 0.719 vs 0.406 (a pooled 0.710 flags 6.9% / 0%);
                              # the multi stratum rests on 17 patients with tight intervals

# --- E4: planted-copy validation, the gate (docs/e4-plan.md) ------------------------------------
# Detector settings and thresholds come only from the frozen E3 file, never from this config.

validation:
  # Decision I (planting design), decided 2026-11-04 by the user while planning E4: bases from 10
  # patients with many multi-lesion slices + 10 others (a plain random draw gives ~25 multi-lesion
  # bases, too few for P6-remove); P4 about the lesion-pixel centroid (not the image centre, which
  # would mix rotation with shift); P5 erode and dilate with the 3x3 cross. Gate rule amended
  # 2026-11-04 (with decision K): see `gate` below
  bases:
    min_informative_slices: 5 # eligible: T patients with at least this many slices with an informative lesion
    patients_multi: 10        # drawn from eligible patients with >= min_multi_slices multi-lesion slices ...
    min_multi_slices: 3
    multi_per_patient: 3      # ... giving this many multi- and single-lesion slices each
    single_per_patient: 2
    patients_other: 10        # drawn from the other eligible patients ...
    slices_per_patient: 5     # ... giving this many random informative slices each
    min_z_gap: 2              # slices of one patient at least this far apart in z
  variants:
    shift_small_px: 2         # P2, one random axis direction per base
    shift_large_px: 5         # P3, same direction as P2; reported only
    rotate_deg: 5             # P4, random sign, about the centroid of all lesion pixels
    rotate_threshold: 0.5     # P4 re-binarizes the bilinearly rotated mask at this value
    morph_px: 1               # P5-erode and P5-dilate, 3x3 cross
    add_min_gap_px: 3         # P6-add: background px between the added lesion and every base lesion
    add_max_tries: 50         # P6-add: H-eval lesions tried per base before the base is skipped
  # Decision I amended 2026-11-04 by the user (first: P5 only): a planted mask counts in the gate only
  # if every informative base lesion is still a lesion >= the bound (planted.csv keeps_base_lesions),
  # for every variant except P6-remove (removes a lesion on purpose); excludes 6 of 100 P4 masks whose
  # 12-19 px lesion fell just below 12 px (they test the bound, not robustness to rotation)
  gate: keeps_base_lesions
  # Decision J, decided 2026-11-04 by the user: caught = flagged (E1 copy; E2 full or partial) and
  # the source patient is the base patient; incompleteness is shown by all_copied, not by the class
  caught: flagged_and_source_patient
  # Decision K (evidence: `e4_validate.py plant`), decided 2026-11-04 by the user before any detector
  # ran on the planted set. P5 is reported only: a 1 px boundary change gives a lesion score of about
  # r^2 (r = area ratio; median 0.43 eroded, 1.7 dilated, plant area_change.csv), below the chance-based
  # single-lesion thresholds for nearly every lesion size, a resolution limit no setting can fix
  criteria:
    recall:                   # share caught (decision J) of the gated planted masks of each variant
      P1: {detector: both, min: 1.0}       # a miss is a bug, not a setting to tune
      P2: {detector: any, min: 0.9}        # any = caught by at least one detector
      P4: {detector: any, min: 0.9}
      P6: {detector: lesion, min: 0.8, variants: [P6-remove, P6-add]}   # pooled; each also reported
    reported_only: [P3, P5-erode, P5-dilate]
    false_positive_max:       # H-eval share flagged, per stratum (point estimate; bootstrap interval reported)
      e1_copy: 0.07           # H-cal at chance 5.1% / 5.3% (single / multi)
      e2_full: 0.07           # H-cal 5.1% / 5.2%
      e2_flagged: 0.12        # full or partial; H-cal 7.4% / 8.7%
  # Accepted deviation from decision K, decided 2026-11-04 by the user AFTER the first `validate` run
  # (recorded as such; null = none). `validate` gives ACCEPTED only if the failed criteria are exactly
  # these; any other failure is still FAIL. E5 runs on PASS or ACCEPTED.
  accepted_deviation:
    criteria: [false positives e1_copy single, false positives e1_copy multi, false positives e2_full single]
    reason: >-
      H-eval false-positive rates 7.2%, 7.4% and 7.1% exceed the 7% limit by 0.1-0.4 points (H-cal at
      the same thresholds 5.1-5.3%); every bootstrap-by-patient interval contains both the limit and the
      H-cal rate. Flags cluster in few patients (top 3 give 33-62% of a cell's flags; 25-26 patients per
      held-out half), so the gap is patient sampling, not a detector fault, and it goes both ways (E2
      full multi 2.9% vs 5.2%). No remedy within the rules: re-fitting thresholds to H-eval would leak
      it into calibration. Every recall criterion passes. E5 compares S with the measured H-eval rates,
      not with 5%.

# --- E5: main audit, S scored once (docs/e5-plan.md) ------------------------------------------
# Every value is fixed before `e5_audit.py score` runs: `score` hashes this section and the frozen
# files (e3_, e5_<dataset>.yaml) and `analyze` refuses to run if they changed (the lock). An analysis
# added after `score` is exploratory. Bootstrap draws: calibration.bootstrap_draws.

audit:
  # Decision L, decided 2026-11-15 by the user while planning E5: the main audit is the clean and minor
  # masks (E0b qc stage); noisy masks are scored by both detectors (not E1 only: E2 sees the lesions
  # without the specks) and reported as separate rows (noisy, main + noisy); failed MRIs and
  # edge-flagged masks stay in
  sets:
    main: [clean, minor]
    noisy: [noisy]
  # Decision M, decided 2026-11-15: the primary family is the excess over H-eval (S iid, H-eval by
  # patient) of these classes x strata, one-sided bootstrap p, Holm-adjusted; everything else
  # secondary with intervals only (AUC, partial / flagged, by size, standardised, per naming scheme)
  primary:
    classes: [e1_copy, e2_full]
    strata: [single, multi]
    adjust: holm
    alpha: 0.05
  size_bins_px: [12, 20, 40, 80]   # secondary: bins of the largest informative lesion (size-confound check)
  # Decision N, decided 2026-11-15: per source patient, source slices sorted by z form one group
  # while consecutive z differ by at most max_gap (not fixed 5-slice windows)
  window:
    kind: chained
    max_gap: 2
  # Decision O, decided 2026-11-15: sensitivity variants scored on S in the same single run (E3
  # sensitivity settings; drop-only = attach gap 0 with the frozen thresholds: H-cal and H-eval have
  # no strays, so their label maps and the thresholds are unchanged)
  sensitivity: [percentile_99, sigma_0.08, bound_10, bound_25, drop_only]
  # Decision P, decided 2026-11-15: H2 at equal false-positive rate, (i) E2 full vs E1 copy at the
  # frozen thresholds, (ii) E2 flagged vs E1 at tau_D* = the H-cal E1 percentile flagging E2 flagged's
  # H-cal rate per stratum (fixed by `prepare`); H2 holds if the interval of the difference of
  # excesses (E2 - E1) is above 0
  h2: matched_on_hcal
  # Decision Q, decided 2026-11-15: near-exact = E1 score >= min_score and above the highest H-cal and
  # H-eval E1 score in its stratum and size bin of the largest lesion (fixed by `prepare`); held-out
  # single-lesion masks reach 0.93-1.0 by chance, so Dice > 0.9 alone is not unambiguous
  near_exact:
    min_score: 0.9
    beyond: heldout_max
    size_bins_px: [4, 12, 20, 40, 80]
  # E8 exit rule, approved with the plan 2026-11-15: E8 is eligible if the grouped count of near-exact
  # copies plus E2 multi-lesion masks with C above the held-out maximum reaches this
  e8_min_strong: 20

# E6 (docs/e6-e7-plan.md): patient exposure, copying vs placement, rarity (H3), duplication (H1).
# Every value set by the user on 2026-11-15 in the planning session, before E6 read S's tables;
# `e6_exposure.py exposure` refuses while one is null. S comes only from E5's stored tables (set main).
exposure:
  # Decision R: one decision-J source patient per flag; pi_p = share of H-eval scorable masks of the
  # stratum whose NN (the detector's own) is p, smoothed toward p's share of T lesion slices:
  # (n_p + m * w_p) / (N + m); concentration against a multinomial null with pi redrawn by H-eval patient
  classes: [e1_copy, e2_full, e2_flagged]
  primary:
    classes: [e1_copy, e2_full]
    strata: [multi]
  expected:
    baseline: H-eval
    smoothing_m: 52.5
    smoothing_m_sensitivity: 105
  top_k: 5
  # Decision U: margin to the second-best patient and source-slice rarity, S flags vs H-eval chance
  # flags (AUC, two-level bootstrap). Reading on the primary cells: "patient copying" if the dispersion
  # is above this percentile of its null and the margin AUC interval lies above 0.5; "typical
  # placement" if the margin AUC interval lies wholly below 0.5 (added 2026-11-15 by the user after
  # the placement mock, before E6 read S), or reaches 0.5 or below with the rarity AUC interval below
  # 0.5; otherwise "undetermined"
  reading:
    dispersion_percentile: 95
    auc_null: 0.5
  # Decision V: slice rarity = 1 - best score against other patients' T slices (E1 and E2 scale);
  # patient rarity = mean distance to the k nearest other patients on z-scored features (counts and
  # areas log1p); H3 Spearman with a permutation p and a bootstrap-over-patients interval
  rarity:
    patient_k: 5
    log1p: [n_lesions3d, volume_px, median_area_px, max_lesions_per_slice]
    features: [n_lesions3d, volume_px, median_area_px, max_lesions_per_slice, position_spread]
    permutations: 10000
  # Decision W: 3D lesions by slice-to-slice one-to-one linking (Hungarian on IoU) of the masks as
  # saved, 26-connectivity as sensitivity; H1 = bin-weighted mean of rho_S - rho_H, Spearman(span,
  # lesion credits) within bins of the 3D lesion's largest area (lower edges, px), against H-eval
  lesions3d:
    main: slice_linking
    sensitivity: connectivity_26
  h1_size_bins_px: [12, 20, 40, 80]
  # Placement mock for `rehearse` (step 3b, approved by the user 2026-11-15): H-cal masks with every
  # lesion moved (shape and size kept) to the position of a random T lesion; the compact variant
  # draws only T lesions inside S's central pixel area (E0b: synthetic centroids fill rows 40-85,
  # cols 55-105; report-notes section 3, "Synthetic lesion positions"). Tests decision U's
  # "typical placement" branch on data
  placement_mock:
    compact_rows: [40, 85]
    compact_cols: [55, 105]
    max_tries: 200

# E7 (docs/e6-e7-plan.md): match reports, deletion test, correctness on planted copies.
# Every value set by the user on 2026-11-15 in the planning session; `e7_reports.py reports` refuses
# while one is null.
reports:
  # Decision X: one report per chained group: near-exact and E2 beyond-held-out masks; the top flag
  # per detector of the most over-exposed patients (E6, primary cells); seeded random contrasts.
  # Correctness scores the decision-J source; the verdict adds the strongest-pair patient if different
  selection:
    strong_tiers: true
    top_exposed_patients: 5
    random_s_multi: 10
    random_heval: 10
  # Decision Y: delete the top vs the smallest contributor (paired lesions, s > 0) of E2-flagged
  # multi-lesion masks; measures: delta C, flag and source kept after a full re-match, delta E1 score
  deletion:
    min_paired: 2
    planted_controls: [P1, P2, P4]
  # Decision Z: thesis-plan criteria on planted copies flagged by E2 (gated); P3, P5 reported only
  correctness:
    slice_window: 2
    patient_min: 0.90
    patient_variants: [P1, P2, P4, P6-add, P6-remove]
    lesions_min: 0.80
    lesion_variants: [P6-add, P6-remove]
  taxonomy: rule_based     # optional, first to cut; rules fixed on the planted variants

# E8 (docs/e8-plan.md): paired synthetic MRI check (RQ4, H4, observational). Every value fixed before
# `e8_paired.py paired` reads S's MRIs; that stage refuses while one is null. Group A, the held-out
# reading, the primary measure and the rehearsal chosen by the user on 2026-11-16 in the planning
# session; the other values approved with the plan the same day. Bootstrap draws:
# calibration.bootstrap_draws; alignment shift search: the frozen E1 max_shift (3 px).
paired:
  # Decision AA: group A = these S rows of E7's report_index.csv (one per chained group); comparison
  # slice = the tier's decision-J source (e1: flagged.csv e1_nn; e2: flagged.csv e2_source)
  group_a:
    near-exact: e1
    beyond held-out: e2
    exposed e1_copy multi: e1
    exposed e2_full multi: e2
  # Decision AB: k controls per case from S main novel masks (neither detector flags them, an
  # informative lesion, MRI not failed), same cell = E2 stratum x informative lesions (1, 2, >= cap) x
  # largest-lesion bin x brain-area quantile of the pool; comparison slice = E2 NN, E1 NN when C = 0.
  # Held-out sets: flagged slices as cases, novel slices as controls, by the same rule
  controls:
    k: 5
    lesion_count_cap: 3
    size_bins_px: [12, 20, 40, 80]
    brain_quantiles: 3
  # Decision AC: z-score each image in its own brain (whole image transformed), align by the E1 shift
  # (recomputed when the comparison slice is not the E1 NN), Gaussian SSIM map averaged over the
  # regions; lesion = informative lesions grown by region_grow_px inside both brains (primary),
  # brain = both brains, ring = lesion without the lesion pixels of either mask
  measure:
    ssim_sigma: 1.5
    data_range: 10            # z-units; set 2026-11-16 by the user: about the median whole-image range of
                              # z-scored T BRAVO (9.80; H-eval 9.26); fixed so every pair shares one scale
    region_grow_px: 8
    regions: [lesion, brain, ring]
    primary: lesion
  # Decision AD: AUC of A vs B (two-level bootstrap by patient) against the same AUC on H-eval
  # (flagged vs novel); "supported (observational)" if the A-vs-B interval is above auc_null and the
  # difference interval above 0, "explained by mask resemblance" if only the first holds, else "not
  # supported". Within A: the E1 runner-up patient's best slice, and the source patient's slices at
  # z +- 1..dz_max
  test:
    reference: H-eval
    auc_null: 0.5
    dz_max: 5
  # Decision AE: rehearse on H-cal (null; must not read "supported") and on planted copies whose
  # "MRI" is the base patient's BRAVO positive_dz slices away (z - positive_dz if outside the
  # volume), shifted with the mask (positive; must read "supported")
  rehearsal:
    null_set: H-cal
    positive_variants: [P1, P2]
    positive_dz: 2

real_datasets:
  stanford_brainmets:
    root: data/StanfordSkullStripped_1mm
    image_file: bravo.nii
    mask_file: seg.nii
    train_split: train        # source folder of training patients -> set T
    heldout_split: test       # source folder of held-out patients -> split below
    heldout_sets: [H-cal, H-eval]   # first set gets floor(n/2) patients, second the rest

synthetic_pools:
  amibekk_v1:
    # ~37.6k samples from the previous thesis; each file is (128, 128, 2) = [MRI, mask]
    dir: data/Synthetic_data/mask_conditioned_synthesis
    glob: "*.nii"
    image_channel: 0
    mask_channel: 1
    trained_on: stanford_brainmets   # real dataset whose train split trained the generator
    legacy_exclusion_file: docs/corrupted_synthetic_masks_10_0.txt   # old QC list, comparison only
