# Default project config. Relative paths are resolved from the repository root.
# To run on new data, add an entry under real_datasets / synthetic_pools (or copy this file)
# and pass --dataset / --pool / --config to the scripts.

seed: 2026                          # single global seed for every random step

output_root: processed_data/model_space   # processed data, one subfolder per dataset/pool
results_root: results                     # experiment outputs (tables, figures)
splits_dir: splits                        # patient splits (version-controlled)

default_real_dataset: stanford_brainmets
default_synthetic_pool: amibekk_v1

# Conversion of real data to the 128x128 "model space", identical to the original training
# transform: LoadImage -> EnsureChannelFirst -> ToTensor -> ScaleIntensity(0, 1) (per volume)
# -> Resize((128, 128, -1)) -> mask > threshold.
preprocessing:
  spatial_size: [128, 128]   # in-plane size; depth is kept (-1 in MONAI Resize)
  interpolation: area        # MONAI Resize default
  mask_threshold: 0.01       # strict '>', as make_binary in the original repo
  slice_axis: 2              # axial

# --- E0b decisions -------------------------------------------------------------------------
# Values marked null are decided by viewing the evidence of a review stage; set them by hand with
# a dated comment. A production stage refuses to run while a value it needs is null.

brain:
  # Decision A (evidence: `e0b_audit.py brain-review`)
  # brain tissue = pixels above this (low_threshold methods and tissue_px); depends on the data,
  # so re-check it with brain-review (threshold sensitivity table) whenever new data is used
  low_threshold: 0.02         # set 2026-11-02: on stanford_brainmets + amibekk_v1 it sits in the gap
                              # between background (99.9th pct <= ~0.01) and dim tissue (~0.03-0.09)
  # options: otsu | otsu_dilate1 | otsu_dilate2 | otsu_all | low_threshold | low_threshold_all
  method: low_threshold_all   # decided 2026-11-01: 1/6101 T lesions >50% outside the brain
                              # (Otsu: 74), 1.5% partly outside; keeps separate pieces in low slices
  # a synthetic MRI with less brain tissue than this counts as failed (near-blank);
  # tissue = pixels above 0.02 in regions >= 30 px (memtk.lesions.tissue_px)
  min_tissue_px: 20           # decided 2026-11-01: below 20 px all viewed synthetic MRIs have no
                              # brain (152 samples); the smallest real T lesion slice has 31 px

lesions:
  connectivity: 8
  # Decisions B and C (evidence: `e0b_audit.py lesions-review`)
  # px; smaller components are specks
  min_lesion_area: 4      # decided 2026-11-02: largest m with <= 1% of T components smaller (0.99%);
                          # clear size break in T and S (62% of synthetic components are 1 px)
  # max background px between a speck and a lesion for the speck to be attached (0 = drop-only)
  attach_gap: 2           # decided 2026-11-02: synthetic specks at gap 1-2 far above the ~1,150 per
                          # gap noise floor seen at gaps 4-10; gap 3 near it

qc:
  # Decision D (evidence: `e0b_audit.py qc-review`)
  # minor if 1..N isolated specks (kept), noisy if more (left out of the main audit)
  max_isolated_specks: 9      # decided 2026-11-02: masks per speck count fall steadily up to ~9, then a
                              # flat tail (~25-30 per count) of noise fields; old QC list excluded all >= 10
  edge_outside_frac: 0.5      # flag a real-sized lesion if more than this fraction lies outside the brain
  small_lesion_px: 40         # the sampling filter's "at least one lesion under 40 px"

filters:
  # the sampling script kept a mask only if its pixel sum was below this (repo: Sampling_mask_bravo.py);
  # its other filters are a lesion under qc.small_lesion_px and every lesion pixel inside the brain
  max_mask_px: 2000
  # Decision E (evidence: `e0b_audit.py filters-review`): which of max_mask_px, small_lesion,
  # inside_brain to apply to H-cal and H-eval (never to T); a list, [] for none
  real_sets: [max_mask_px]   # decided 2026-11-03: only this filter holds in the pool (100%; removes no real
                             # slice); small_lesion fails for 10.7% of the masks as saved, inside_brain is not
                             # shown with a meaningful brain definition

# --- E1-E3: detectors and calibration (docs/e1-e3-plan.md) ------------------------------------
# Fixed values come from the experiment plan; decisions are null until set after their review
# stage (`e3_calibrate.py`). E4 and E5 read the frozen copy written by `e3_calibrate.py freeze`.

detectors:
  whole_mask:                 # E1
    top_k_dice: 20            # candidates per query: the best by plain Dice ...
    top_k_centroid: 20        # ... plus the nearest by the centroid of the largest lesion
    max_shift_px: 3           # shift search of +-3 px in rows and columns (49 positions)
  lesion:                     # E2
    # Decision F (evidence: e0b_audit.py stats, centroid density)
    position_frame: pixel     # decided 2026-11-03: pixel coordinates; stage 1 copies keep the training
                              # mask's pixel positions, synthetic brains are smaller (median 3,009 vs 7,765 px)
    sigma: 0.05               # position factor exp(-d^2 / 2 sigma^2); fraction of the 128-px field = 6.4 px
    prefilter: 0.2            # lesion pairs farther apart are skipped: 25.6 px, position factor exp(-8)
    candidate_min_s: 0.1      # C is computed only for training slices sharing a lesion pair with s >= this

calibration:                  # E3
  percentile: 95              # thresholds at this percentile of H-cal
  bootstrap_draws: 2000       # bootstrap by patient for the interval of every threshold
  # Decision G (evidence: `e3_calibrate.py bound-review`)
  provisional_tau_L: 0.77     # decided 2026-11-03: 95th percentile of the best scores of H-cal lesions >= 10 px
  chance_rate_max: 0.10       # decided 2026-11-03: the 5% cut falls within noise (15-24 px bins at 5.1-5.8%)
                              # and would remove 59% of S main from the lesion-level analysis
  informative_bound_px: 12    # decided 2026-11-03: from 12 px every bin stays below 10% (8.4% at 12-14 px);
                              # S main keeps 72% of slices; 25 px (5% cut) is run as a sensitivity in calibrate
  # Decision H (evidence: `e3_calibrate.py calibrate`): per detector, "stratified" (separate
  # thresholds for single- and multi-lesion slices) or "pooled"
  strata:
    whole_mask: null
    lesion: null

real_datasets:
  stanford_brainmets:
    root: data/StanfordSkullStripped_1mm
    image_file: bravo.nii
    mask_file: seg.nii
    train_split: train        # source folder of training patients -> set T
    heldout_split: test       # source folder of held-out patients -> split below
    heldout_sets: [H-cal, H-eval]   # first set gets floor(n/2) patients, second the rest

synthetic_pools:
  amibekk_v1:
    # ~37.6k samples from the previous thesis; each file is (128, 128, 2) = [MRI, mask]
    dir: data/Synthetic_data/mask_conditioned_synthesis
    glob: "*.nii"
    image_channel: 0
    mask_channel: 1
    trained_on: stanford_brainmets   # real dataset whose train split trained the generator
    legacy_exclusion_file: docs/corrupted_synthetic_masks_10_0.txt   # old QC list, comparison only
